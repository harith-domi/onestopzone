<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oszCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#45cfee"/>
      <stop offset="55%" stop-color="#1aa7d4"/>
      <stop offset="100%" stop-color="#0e7fb5"/>
    </linearGradient>
    <linearGradient id="oszNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4576"/>
      <stop offset="100%" stop-color="#152c52"/>
    </linearGradient>
  </defs>
  <!-- back shadow arcs (3D depth) -->
  <path d="M 140.5 38.5 A 72 72 0 0 0 33.5 62" fill="none" stroke="#152c52" stroke-width="20" stroke-linecap="round" opacity="0.9" transform="rotate(8 100 100)"/>
  <path d="M 59.5 161.5 A 72 72 0 0 0 166.5 138" fill="none" stroke="#152c52" stroke-width="20" stroke-linecap="round" opacity="0.9" transform="rotate(8 100 100)"/>
  <!-- main cyan circle arcs with gaps at top-right / bottom-left -->
  <path d="M 137.5 35.1 A 75 75 0 1 0 35.1 137.5" fill="none" stroke="url(#oszCyan)" stroke-width="21" stroke-linecap="round"/>
  <path d="M 62.5 164.9 A 75 75 0 1 0 164.9 62.5" fill="none" stroke="url(#oszCyan)" stroke-width="21" stroke-linecap="round"/>
  <!-- angular S monogram -->
  <polyline points="146,22 146,52 78,52 146,138 60,138 60,178"
        fill="none" stroke="url(#oszNavy)" stroke-width="24" stroke-linejoin="miter" stroke-miterlimit="4"/>
</svg>
